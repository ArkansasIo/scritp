name: Documentation and PowerShell validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path . -Filter '*.ps1' -Recurse)
          if ($scripts.Count -eq 0) {
            throw 'No PowerShell scripts were found.'
          }

          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($script.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path . -Filter '*.ps1' -Recurse)
          $failed = $false
          foreach ($script in $scripts) {
            $results = @(Invoke-ScriptAnalyzer -Path $script.FullName -Severity Error)
            if ($results.Count -gt 0) {
              $failed = $true
              Write-Host "PSScriptAnalyzer errors in $($script.FullName):"
              $results | Format-Table -AutoSize | Out-String | Write-Host
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Check required project documentation
        shell: pwsh
        run: |
          $required = @('README.md', 'SECURITY.md', '.gitignore', 'docs/SETUP_TROUBLESHOOTING.md')
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "Missing expected files: $($missing -join ', ')"
            exit 1
          }
